name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    # Luma ships for Windows and macOS, so a Linux-only check was proving less than it
    # looked: nothing platform-specific, and none of the packaging, ever ran on a pull
    # request. Ubuntu stays because it is the fastest way to catch a path or casing
    # assumption that only bites away from Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # -warnaserror: the build is at zero warnings, and this is what keeps it there.
      # A warning that nothing blocks is a warning that accumulates.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration"

      # The integration tests load the native LibVLC libraries, which arrive with the
      # VideoLAN.LibVLC.Windows package — so Windows is the one runner that can actually
      # run them. Headless: they construct and dispose the engine, they do not render.
      - name: Integration tests
        if: matrix.os == 'windows-latest'
        run: dotnet test --no-build --configuration Release --filter "Category=Integration"

      # The macOS app is only ever published when a release is cut, which is the worst
      # moment to discover it cannot be. The reference to the Windows libvlc package is
      # conditioned on the runtime identifier, so publishing for a Mac takes a different
      # path through the project file than anything else here — and that path had no
      # check on it at all. Packaging the disk image stays in the release workflow; this
      # is the part that breaks.
      - name: Publish check (osx-arm64)
        if: matrix.os == 'macos-latest'
        run: |
          dotnet publish src/Luma.Presentation/Luma.Presentation.csproj \
            --configuration Release \
            --runtime osx-arm64 \
            --self-contained true \
            --output artifacts/ci-publish

  # One status check with a stable name for branch protection to require.
  #
  # A matrix reports as "checks (ubuntu-latest)", "checks (windows-latest)" and so on —
  # names that change whenever the matrix does, and a required check that no longer
  # appears blocks every pull request for ever. This job is the single name that outlives
  # the matrix; it passes only when every leg passed.
  build:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report matrix result
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          [ "$RESULT" = "success" ]
