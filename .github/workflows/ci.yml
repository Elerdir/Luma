name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests load the native LibVLC libraries, which are not present
      # on a headless runner. They are excluded here and run locally instead.
      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration"
