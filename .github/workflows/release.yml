name: Release

# Builds installers for Windows and macOS.
#
#   - Publishing a GitHub release builds both, attaches them to that release and
#     uploads them to UpdateHub.
#   - Running it by hand builds both and leaves them as workflow artifacts, so the
#     packaging can be exercised without cutting a release.
#
# UpdateHub upload is skipped unless UPDATEHUB_URL and UPDATEHUB_CI_TOKEN are set,
# so the workflow is useful before the update server is configured.
#
# Required secrets (optional — upload is skipped without them):
#   UPDATEHUB_URL       e.g. https://updates.example.com
#   UPDATEHUB_CI_TOKEN  CI or personal access token
# Optional repo variable:
#   APP_SLUG            defaults to "luma"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Resolve the version once so both platforms package the same number.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        # Both values arrive through env rather than being pasted into the script.
        # ${{ }} is substituted as text before the shell ever sees it, so a tag or an
        # input containing shell syntax would run as part of this step; read as a
        # variable it is only ever data.
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "release" ]; then
            # Strip a leading "v" from the tag: v1.2.0 -> 1.2.0
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Pinned to 5.x: from v6 onwards WiX requires accepting the Open Source
      # Maintenance Fee EULA. Keep in step with instalator.bat.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: cmd
        run: instalator.bat %VERSION%

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-windows-x64
          path: dist/*.msi
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Every step of the packaging lives in the script, not here — the same shape
      # the Windows job has with instalator.bat. A workflow step is the one place a
      # build cannot be run from, and the macOS bundle is the one that most needs
      # trying out by hand.
      - name: Build the disk image
        run: ./installer/macos/build-dmg.sh "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    # Only when an actual release was published; manual runs stop at the artifacts.
    if: github.event_name == 'release'
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_SLUG: ${{ vars.APP_SLUG || 'luma' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach installers to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload to UpdateHub
        env:
          UPDATEHUB_URL: ${{ secrets.UPDATEHUB_URL }}
          UPDATEHUB_CI_TOKEN: ${{ secrets.UPDATEHUB_CI_TOKEN }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          if [ -z "$UPDATEHUB_URL" ] || [ -z "$UPDATEHUB_CI_TOKEN" ]; then
            echo "UPDATEHUB_URL / UPDATEHUB_CI_TOKEN not set — skipping upload."
            exit 0
          fi

          upload() {
            local file="$1" platform="$2" arch="$3"
            echo "Uploading $(basename "$file") ($platform/$arch)"
            curl -f -X POST "$UPDATEHUB_URL/api/ci/apps/$APP_SLUG/releases" \
              -H "X-UpdateHub-Token: $UPDATEHUB_CI_TOKEN" \
              -F "file=@$file" \
              -F "version=$VERSION" \
              -F "platform=$platform" \
              -F "arch=$arch" \
              -F "channel=stable" \
              -F "release_notes=$RELEASE_NOTES"
          }

          for f in dist/*.msi; do [ -e "$f" ] && upload "$f" windows x64; done
          for f in dist/*.dmg; do [ -e "$f" ] && upload "$f" macos arm64; done

          echo "Uploaded as a draft — publish it in the UpdateHub admin UI."
