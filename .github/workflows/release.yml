name: Release

# Builds installers for Windows and macOS.
#
#   - Publishing a GitHub release builds both, attaches them to that release and
#     uploads them to UpdateHub.
#   - Running it by hand builds both and leaves them as workflow artifacts, so the
#     packaging can be exercised without cutting a release.
#
# UpdateHub upload is skipped unless UPDATEHUB_URL and UPDATEHUB_CI_TOKEN are set,
# so the workflow is useful before the update server is configured.
#
# Required secrets (optional — upload is skipped without them):
#   UPDATEHUB_URL       e.g. https://updates.example.com
#   UPDATEHUB_CI_TOKEN  CI or personal access token
# Optional repo variable:
#   APP_SLUG            defaults to "luma"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Resolve the version once so both platforms package the same number.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        # Both values arrive through env rather than being pasted into the script.
        # ${{ }} is substituted as text before the shell ever sees it, so a tag or an
        # input containing shell syntax would run as part of this step; read as a
        # variable it is only ever data.
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "release" ]; then
            # Strip a leading "v" from the tag: v1.2.0 -> 1.2.0
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Pinned to 5.x: from v6 onwards WiX requires accepting the Open Source
      # Maintenance Fee EULA. Keep in step with instalator.bat.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: cmd
        run: instalator.bat %VERSION%

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-windows-x64
          path: dist/*.msi
          if-no-files-found: error

  macos:
    needs: version
    # Both architectures. Apple silicon is what anyone buying a Mac since 2020 has,
    # but the update client asks the server for the architecture it is running on, so
    # an Intel Mac with nothing published for it is told nothing at all — update
    # checks are silent by design, and the user would never learn why.
    #
    # Cross-compiled: macos-latest is Apple silicon and builds the Intel bundle with
    # --runtime osx-x64, taking libvlc from VLC's own Intel disk image. Nothing here
    # runs the result, which is the same as before — see the README on testing.
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      # Whether the optional steps below run. Resolved here because a step's `if` can
      # read the env context but not the secrets one.
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Signing and notarisation are skipped entirely unless the secrets are set, so
      # this workflow keeps working with no Apple Developer account — which is where
      # the project is today. What the account buys is an application that opens by
      # double-clicking it instead of one the user has to allow in System Settings.
      #
      # Required for signing:
      #   MACOS_CERTIFICATE           Developer ID Application .p12, base64-encoded
      #   MACOS_CERTIFICATE_PASSWORD  its export password
      #   MACOS_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
      # Additionally for notarisation:
      #   MACOS_NOTARY_APPLE_ID       the Apple ID the account belongs to
      #   MACOS_NOTARY_TEAM_ID        the ten-character team identifier
      #   MACOS_NOTARY_PASSWORD       an app-specific password for that Apple ID
      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/luma-signing.keychain-db"
          # Throwaway, and gone with the runner. Never written to the log.
          password="$(openssl rand -base64 24)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"

          # Without this codesign prompts for keychain access, which on a runner with
          # nobody at the keyboard means hanging until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null

          security list-keychain -d user -s "$keychain" login.keychain-db

          echo "CODESIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      # Every step of the packaging lives in the script, not here — the same shape
      # the Windows job has with instalator.bat. A workflow step is the one place a
      # build cannot be run from, and the macOS bundle is the one that most needs
      # trying out by hand.
      #
      # CODESIGN_IDENTITY is set by the step above when a certificate exists; unset,
      # the script signs ad-hoc.
      - name: Build the disk image
        run: ./installer/macos/build-dmg.sh "$VERSION" "$ARCH"

      # Notarisation is what stops macOS telling the user the app cannot be verified.
      # It needs the bundle to be signed with a real identity and built with the
      # hardened runtime, which is why it is gated on the same certificate.
      - name: Notarise and staple
        if: env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          for image in dist/*.dmg; do
            echo "Submitting $(basename "$image")"
            xcrun notarytool submit "$image" \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              --wait

            # Stapling attaches the ticket to the file, so the first launch works
            # without asking Apple — including on a machine that happens to be offline.
            xcrun stapler staple "$image"
            xcrun stapler validate "$image"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # One name per leg — two jobs writing the same artifact name is an error.
          name: luma-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    # Only when an actual release was published; manual runs stop at the artifacts.
    if: github.event_name == 'release'
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_SLUG: ${{ vars.APP_SLUG || 'luma' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach installers to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload to UpdateHub
        env:
          UPDATEHUB_URL: ${{ secrets.UPDATEHUB_URL }}
          UPDATEHUB_CI_TOKEN: ${{ secrets.UPDATEHUB_CI_TOKEN }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          if [ -z "$UPDATEHUB_URL" ] || [ -z "$UPDATEHUB_CI_TOKEN" ]; then
            echo "UPDATEHUB_URL / UPDATEHUB_CI_TOKEN not set — skipping upload."
            exit 0
          fi

          upload() {
            local file="$1" platform="$2" arch="$3"
            echo "Uploading $(basename "$file") ($platform/$arch)"
            curl -f -X POST "$UPDATEHUB_URL/api/ci/apps/$APP_SLUG/releases" \
              -H "X-UpdateHub-Token: $UPDATEHUB_CI_TOKEN" \
              -F "file=@$file" \
              -F "version=$VERSION" \
              -F "platform=$platform" \
              -F "arch=$arch" \
              -F "channel=stable" \
              -F "release_notes=$RELEASE_NOTES"
          }

          for f in dist/*.msi; do [ -e "$f" ] && upload "$f" windows x64; done

          # The architecture comes from the file name — Luma-<version>-<arch>.dmg —
          # rather than being assumed. Announcing an Intel build as arm64 would offer
          # every Apple silicon Mac an update it cannot run.
          for f in dist/*.dmg; do
            [ -e "$f" ] || continue
            name="$(basename "$f" .dmg)"
            upload "$f" macos "${name##*-}"
          done

          echo "Uploaded as a draft — publish it in the UpdateHub admin UI."
